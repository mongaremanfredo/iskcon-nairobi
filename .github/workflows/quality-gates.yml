name: Quality gates

on:
  push:
    branches: [development, staging, release, main]
  pull_request:
    branches: [development, staging, release, main]

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-check:
    name: Lint, tests, PWA, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Action revisions are pinned so a mutable upstream tag cannot alter the
      # release pipeline without a reviewed repository change.
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify branch promotion path
        if: github.event_name == 'pull_request'
        run: npm run verify:promotion

      - name: Run release checks
        run: npm run check:release
        env:
          CI: "true"
